[workspace]
resolver = "3"
members = ["crates/domain", "crates/store", "crates/server", "crates/mobile", "app"]
default-members = ["crates/domain", "crates/store", "crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
domain = { path = "crates/domain" }
store = { path = "crates/store" }
server = { path = "crates/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
