[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mindblow"
path = "src/main.rs"

[dependencies]
domain.workspace = true
store.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
futures-util = "0.3.34"
# Cliente do sync. TLS com rustls + ring e as raízes do webpki-roots, sem depender
# do verificador do sistema: compila igual no Linux, no Windows e no Android.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls-no-provider"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# O feed e as notas vão comprimidos: um board é JSON e encolhe uns 3x.
tower-http = { version = "0.6", features = ["compression-gzip", "decompression-gzip"] }
flate2 = "1"
